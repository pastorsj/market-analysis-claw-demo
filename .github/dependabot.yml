# One grouped pull request per ecosystem each month.
version: 2

updates:
  - package-ecosystem: uv
    directories:
      - /agent
      - /api
      - /data
      - /data/generate
      - /eval
      - /tools/market-analytics
      - /tools/retrieval
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # DuckDB files written by one version cannot be read by an older one: bump the
      # writer (data) and every reader together, by hand.
      - dependency-name: duckdb
      # RAPIDS moves as one release train (26.6.*); bump cudf, cuml, nx-cugraph, libcugraph and
      # pylibcugraph together by hand.
      - dependency-name: "cudf*"
      - dependency-name: "cuml*"
      - dependency-name: "*cugraph*"
      - dependency-name: "rapids*"

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Major versions (React, TypeScript, Zod, the KUI components, ...) change APIs or the UI's
      # look: upgrade them by hand, one at a time, against the visual baselines.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /agent
      - /api
      - /data
      - /infra/openshell
      - /infra/switchyard
      - /tools/market-analytics
      - /tools/retrieval
      - /ui
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Major versions of a base image (Node, Debian, ...) are upgraded by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Python base image (tools/retrieval/Dockerfile's FROM line) stays on Python 3.12, which
      # every service's pyproject.toml requires: only its patch releases come here.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
