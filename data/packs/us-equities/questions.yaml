#
# yaml-language-server: $schema=../../schemas/questions.schema.json
#
# The us-equities questions: the UI scenario list and the replay recording set (featured). Featured questions need
# only the default profiles. eval/oracles/ computes the analytics answers from a build, and eval/retrieval.yaml
# names the documents the retrieval answers cite. The pack has no ticker-linked news, so no question uses the news
# tools; SEC filings are a separate document source, connected to the prices only by company.
schema_version: "1"
questions:
- id: market-leaders
  label: Market Leaders
  tag: ANALYTICS
  description: Scan the 50 most liquid US stocks for their strongest and weakest recent returns.
  question: >-
    Among the 50 most liquid US stocks, which had the strongest and weakest returns over the 20 trading sessions
    ending March 12, 2026, and how did their daily volatility compare?
  sources: [market_data]
  featured: true
- id: intraday-ranges
  label: Intraday Swings
  tag: INTRADAY
  description: Scan real one-minute bars for the sessions with the widest intraday swings.
  question: >-
    Among the 50 most liquid US stocks, which sessions from March 2 through March 12, 2026 had the widest intraday
    price ranges? For each, how did it trade from open to close, and how much of its volume came in the last 30
    minutes?
  sources: [market_data]
  featured: true
- id: unusual-sessions
  label: Unusual Sessions
  tag: ANOMALY
  description: Rank unusual return, volatility and volume combinations across the 50 most liquid stocks.
  question: >-
    Using 2025 as the baseline, which 10 sessions from January 2 through March 12, 2026 were the most unusual
    among the 50 most liquid US stocks, and which features made each one unusual? Anomaly scores are neither
    forecasts nor explanations.
  sources: [market_data]
  featured: true
- id: peer-network
  label: Peer Network
  tag: GRAPH
  description: Find the most central stocks in the return-correlation network of same-industry peers.
  question: >-
    Among declared industry peers, which stocks were the most central in the return-correlation network from
    December 2025 through March 12, 2026, and which pairs moved together most closely?
  sources: [market_data]
  featured: true
- id: cyber-disclosure-rules
  label: Cybersecurity Disclosures
  tag: RETRIEVAL
  description: Pair the Form 8-K Item 1.05 rule with filings by companies in the pack that report an incident.
  question: >-
    What does Form 8-K Item 1.05 require a company to disclose about a material cybersecurity incident, and by
    when? Cite the regulation, and any 8-K filings in the corpus that report an incident under Item 1.05.
  sources: [sec_filings, market_regulations]
  featured: true
- id: moves-and-filings
  label: Moves & Filings
  tag: HYBRID
  description: Price moves and SEC filings as two separate sources, joined only by company.
  question: >-
    Among the 50 most liquid US stocks, which three had the strongest and which three the weakest returns in
    February 2026? Separately, what did those six companies disclose in their 8-K filings from January through
    March 2026? Report the moves and the filings apart, and do not claim that a filing caused a move.
  sources: [market_data, sec_filings]
  featured: true
- id: large-universe-scan
  label: Whole-Market Scan
  tag: ANALYTICS
  description: Scan the 500 most liquid stocks at once.
  question: >-
    Across the 500 most liquid US stocks, which 20 had the strongest and the weakest returns from January 2 to
    March 12, 2026, and how unusual was their trading volume?
  sources: [market_data]
- id: outcome-prediction
  label: Five-Session Outlook
  tag: PREDICTION
  description: Rank the 50 most liquid stocks with a five-session prediction anchored before the outcomes.
  question: >-
    As of the March 5, 2026 market close, which of the 50 most liquid stocks are most likely to post a positive
    five-session return?
  sources: [market_data]
- id: sector-sql
  label: Sector Breakdown
  tag: SQL
  description: Count stocks and summarize returns by SIC division with SQL.
  question: >-
    How many stocks are in each SIC division, and what was each division's median return from January 2 to
    March 12, 2026?
  sources: [market_data]
- id: world-news-rates
  label: World Headlines
  tag: RETRIEVAL
  description: Search the optional GDELT world news headlines, a source that is not linked to any stock.
  question: >-
    Which world news headlines in the corpus mention the Federal Reserve or another central bank? List their
    outlets and dates, and cite the headlines.
  sources: [world_news]
# Multi-turn conversations, each recorded as one replay session with --all: a later turn refers to an earlier answer.
conversations:
- id: price-context-follow-up
  label: Price Context Follow-up
  tag: ANALYTICS
  description: Summarize two stocks' daily price context, then add a third and aggregate the series weekly.
  sources: [market_data]
  turns:
  - >-
    Summarize the daily price context for NVIDIA (NVDA) and Apple (AAPL) from February 2 through February 27, 2026,
    including each stock's return, price range and average volume.
  - Keep that same window and add Microsoft (MSFT), but aggregate the displayed series weekly.
- id: peer-network-follow-up
  label: Peer Network Follow-up
  tag: GRAPH
  description: Find the most central peers, then compare their returns and volatility over the same window.
  sources: [market_data]
  turns:
  - >-
    Among declared industry peers, which five stocks were the most central in the return-correlation network from
    December 2025 through March 12, 2026?
  - >-
    For the three most central stocks in that result, compare their returns and daily volatility over the same
    window.
- id: leaders-unusual-sessions
  label: Leaders & Unusual Sessions
  tag: ANOMALY
  description: Rank the strongest and weakest recent returns, then check those stocks for unusual sessions.
  sources: [market_data]
  turns:
  - >-
    Among the 50 most liquid US stocks, which three had the strongest and which three the weakest returns over the
    20 trading sessions ending March 12, 2026?
  - >-
    Using 2025 as the baseline, did any of those six stocks have unusual sessions in that same window? Name the
    sessions and the features that made each one unusual. Anomaly scores are neither forecasts nor explanations.
- id: filings-to-regulations
  label: Filings & Regulations
  tag: RETRIEVAL
  description: Pick two 8-K cybersecurity incident filings, then compare them with the Title 17 requirements.
  sources: [sec_filings, market_regulations]
  turns:
  - >-
    Which 8-K filings in the corpus report a cybersecurity incident under Item 1.05? Select two examples with
    materially different disclosed impacts, and cite the filings.
  - >-
    For those same two examples, compare the disclosed facts with the Title 17 cybersecurity incident disclosure
    requirements, and identify what the evidence does not establish.
- id: regulation-fd-follow-up
  label: Regulation FD Follow-up
  tag: RETRIEVAL
  description: Explain when Regulation FD requires public disclosure, then separate intentional from unintentional cases.
  sources: [market_regulations]
  turns:
  - >-
    Under Regulation FD in Title 17, when must an issuer publicly disclose material nonpublic information that it
    shared with certain persons outside the company? Cite the relevant sections.
  - >-
    Now separate the intentional and the unintentional selective disclosure cases, and say how the issuer may make
    the public disclosure, keeping the section citations.
